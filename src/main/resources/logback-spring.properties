# Logback 配置文件
# 用於控制 HikariCP 和資料庫相關的日誌輸出

# Root logger
logger.root.level=INFO

# HikariCP 日誌
logger.hikari.name=com.zaxxer.hikari
logger.hikari.level=INFO

# Hibernate 日誌
logger.hibernate.name=org.hibernate
logger.hibernate.level=INFO

# SQL 日誌 (如果需要查看 SQL 語句)
logger.hibernate.sql.name=org.hibernate.SQL
logger.hibernate.sql.level=DEBUG

# SQL 參數日誌 (如果需要查看參數綁定)
logger.hibernate.type.name=org.hibernate.type.descriptor.sql.BasicBinder
logger.hibernate.type.level=TRACE

# Spring JDBC 日誌
logger.spring.jdbc.name=org.springframework.jdbc
logger.spring.jdbc.level=DEBUG

# 應用程式日誌
logger.app.name=com.example.demo
logger.app.level=INFO
